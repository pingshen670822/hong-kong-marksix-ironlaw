name: 香港六合彩新核心自動更新
on:
  schedule:
    # 每3小時檢查，涵蓋常態及節日／金多寶臨時開彩日。
    - cron: "0 */3 * * *"
    # 香港時間21:15後密集檢查（UTC 13:20–14:30）。
    - cron: "20-55/5 13 * * *"
    - cron: "0-30/5 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: hk-marksix-new-engine
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy==2.3.5
      - name: 抓取六合彩、結算、重算、產生戰報
        run: python update.py
      - name: 發布前完整檢測
        run: python verify.py
      - name: 同步手機雲端
        run: |
          git config user.name "hk-marksix-engine-bot"
          git config user.email "actions@github.com"
          git add data reports site docs
          git diff --cached --quiet || (git commit -m "六合彩新核心開獎後自動更新" && git push)
      - name: 啟用獨立手機雲端
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: 打包最新戰報
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: 發布最新戰報
        uses: actions/deploy-pages@v4
