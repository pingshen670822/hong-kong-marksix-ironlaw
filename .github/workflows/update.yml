name: 香港六合彩新核心自動更新
on:
  push:
    branches: [main]
  schedule:
    # 每小時健康檢查，涵蓋常態及節日／金多寶臨時開彩日。
    - cron: "0 * * * *"
    # 香港時間21:20後密集檢查，並延伸至開獎後兩小時監控。
    - cron: "20-55/5 13 * * *"
    - cron: "0-30/5 14 * * *"
    - cron: "35-55/5 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hk-marksix-new-engine
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install numpy==2.3.5
      - name: 抓取、重算、故障自修復（最多4次）
        run: python watchdog.py
      - name: 每日資料完整性稽核
        run: python daily_integrity_audit.py
      - name: 發布前雙軌檢測（資料故障阻擋、模型未達門檻降級）
        run: python verify.py
      - name: 全系統健康檢測
        run: python health_check.py
      - name: 成功後同步完整手機雲端
        if: success()
        run: |
          git config user.name "hk-marksix-engine-bot"
          git config user.email "actions@github.com"
          git add data reports site docs
          git diff --cached --quiet || (git commit -m "六合彩新核心開獎後自動更新" && git push)
      - name: 失敗時保留雲端故障證據
        if: failure()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          payload={"status":"主更新失敗，第二層雲端救援即將啟動","run_id":os.environ["RUN_ID"],"recorded_at":datetime.now(timezone.utc).isoformat()}
          for base in ("reports","site","docs"):
              Path(base,"cloud_failure_status.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          git config user.name "hk-marksix-repair-bot"
          git config user.email "actions@github.com"
          git add reports/repair_status.json site/repair_status.json docs/repair_status.json reports/cloud_failure_status.json site/cloud_failure_status.json docs/cloud_failure_status.json
          git diff --cached --quiet || (git commit -m "記錄六合彩雲端故障並啟動救援" && git push)
