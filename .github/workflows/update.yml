name: 香港六合彩新核心自動更新
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'reports/**'
      - 'site/**'
      - 'docs/**'
      - 'v10_system/releases/**'
      - 'v10_system/CURRENT'
  schedule:
    - cron: "11,41 * * * *"
    - cron: "20-55/5 13 * * *"
    - cron: "0-30/5 14 * * *"
    - cron: "35-55/5 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hk-marksix-new-engine
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -r v10_system/requirements.txt
      - name: 還原已驗證 V10 發布指標
        run: python v10_runner.py init
      - name: V10 資料、數學、封存、交易及舊版回歸測試
        working-directory: v10_system
        run: python -m unittest discover -s tests -v
      - name: 官方更新並準備完整同版本報表
        run: python v10_runner.py update
      - name: 驗證原生輸出及舊頁相容輸出
        run: python v10_runner.py verify
      - name: 同一提交同步完整戰報與封存歷史
        if: success()
        run: |
          git config user.name "hk-marksix-engine-bot"
          git config user.email "actions@github.com"
          git add -- v10_system/CURRENT v10_system/releases reports site docs
          git diff --cached --quiet || (git commit -m "六合彩 V10 官方驗證發布 [skip ci]" && git push)
      # Failure intentionally makes no public commit: keep the entire last-good release.
