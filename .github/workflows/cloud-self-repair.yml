name: 香港六合彩第二層雲端自主修復
on:
  workflow_run:
    workflows: ["香港六合彩新核心自動更新"]
    types: [completed]
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hk-marksix-new-engine
  cancel-in-progress: false
jobs:
  repair:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -r v10_system/requirements.txt
      - name: 還原並驗證已發布的 V10 指標
        run: python v10_runner.py init
      - name: 檢查 V10 主流程是否失敗或逾時
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python v10_runner.py guard
      - name: 完整回歸與故障復原測試
        if: steps.guard.outputs.run_repair == 'true'
        working-directory: v10_system
        run: python -m unittest discover -s tests -v
      - name: 以 V10 重新更新並驗證
        if: steps.guard.outputs.run_repair == 'true'
        run: |
          python v10_runner.py update
          python v10_runner.py verify
      - name: 僅成功後同一提交發布
        if: steps.guard.outputs.run_repair == 'true' && success()
        run: |
          git config user.name "hk-marksix-repair-bot"
          git config user.email "actions@github.com"
          git add -- v10_system/CURRENT v10_system/releases reports site docs
          git diff --cached --quiet || (git commit -m "六合彩 V10 第二層驗證發布 [skip ci]" && git push)
      # Failure records remain in Actions logs; no partial status/report overwrite.
